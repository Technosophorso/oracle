# nginx config for parles.xyz (reference Oracle node).
#  - parles.xyz        : static site + /.well-known/agent-marketplace.json
#  - relay.parles.xyz  : strfry Nostr relay (WebSocket, proxied to 127.0.0.1:7777).
#                        NIP-11 requests (Accept: application/nostr+json) are answered by
#                        nginx from relay-info.json, because strfry's built-in NIP-11
#                        can't carry the custom `oracle_marketplace` block (docs/RELAY-INFO.md).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_accept $wants_nip11 { default 0; "~*application/nostr\+json" 1; }

server {
    listen 80; listen [::]:80;
    server_name parles.xyz relay.parles.xyz;
    location /.well-known/acme-challenge/ { root /var/www/parles; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name parles.xyz;
    ssl_certificate     /etc/letsencrypt/live/parles.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parles.xyz/privkey.pem;
    root /var/www/parles;

    location = /.well-known/agent-marketplace.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
    }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name relay.parles.xyz;
    ssl_certificate     /etc/letsencrypt/live/parles.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parles.xyz/privkey.pem;

    location = /_nip11 {
        internal;
        alias /var/www/relay/relay-info.json;
        default_type application/nostr+json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    location / {
        if ($wants_nip11) { rewrite ^ /_nip11 last; }
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
